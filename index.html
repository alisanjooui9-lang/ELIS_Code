<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ELIS Code | جهان یادگیری برنامه‌نویسی</title>

  <meta
    name="description"
    content="ELIS Code؛ یک جهان آموزشی برای برنامه‌نویسی، هوش مصنوعی، ساخت اپ، وب، بازی و فناوری."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================================
       CINEMATIC INTRO
  ====================================================== -->

  <section id="introScreen" class="intro-screen">

    <div class="intro-particles"></div>

    <div class="intro-content">

      <div class="intro-studio">
        ELIS STUDIO PRESENTS
      </div>

      <div class="elis-logo">
        <span>ELIS</span>
        <strong>CODE</strong>
      </div>

      <p class="intro-subtitle">
        یک جهان برای یادگیری، ساختن و خلق کردن
      </p>

    </div>

    <div class="intro-progress">
      <span></span>
    </div>

  </section>


  <!-- =====================================================
       MAIN APPLICATION
  ====================================================== -->

  <main id="app" class="app hidden">

    <!-- ===================================================
         NAVBAR
    ==================================================== -->

    <header class="navbar">

      <button
        type="button"
        class="brand-button"
        onclick="ELIS.goHome()"
        aria-label="صفحه اصلی"
      >

        <div class="brand-mark">
          E
        </div>

        <div class="brand-text">
          <strong>ELIS</strong>
          <span>CODE</span>
        </div>

      </button>


      <nav class="main-nav">

        <button type="button" onclick="ELIS.goHome()">
          خانه
        </button>

        <button type="button" onclick="ELIS.showDomains()">
          حوزه‌ها
        </button>

        <button type="button" onclick="ELIS.showProjects()">
          پروژه‌ها
        </button>

        <button type="button" onclick="ELIS.showAbout()">
          درباره ELIS
        </button>

      </nav>


      <div class="nav-user-area">

        <div id="navStats" class="nav-stats hidden">

          <span>
            ⭐ <b id="navXP">0</b>
          </span>

          <span>
            🪙 <b id="navCoins">0</b>
          </span>

        </div>


        <button
          id="loginButton"
          type="button"
          class="nav-login"
          onclick="ELIS.showAuth()"
        >
          ورود / ثبت‌نام
        </button>

      </div>

    </header>


    <!-- ===================================================
         PAGE CONTAINER
    ==================================================== -->

    <div id="pageContainer">

      <!-- صفحات توسط app.js ساخته می‌شوند -->

    </div>


    <!-- ===================================================
         FOOTER
    ==================================================== -->

    <footer class="site-footer">

      <div class="footer-brand">

        <div class="footer-logo">
          ELIS
        </div>

        <p>
          یک جهان آموزشی برای ساختن آینده.
        </p>

      </div>


      <div class="footer-links">

        <button type="button" onclick="ELIS.showDomains()">
          حوزه‌های آموزشی
        </button>

        <button type="button" onclick="ELIS.showProjects()">
          پروژه‌ها
        </button>

        <button type="button" onclick="ELIS.showAbout()">
          درباره ما
        </button>

      </div>


      <div class="footer-bottom">
        © 2026 ELIS Studio — ELIS Code
      </div>

    </footer>

  </main>


  <!-- =====================================================
       GLOBAL MODAL
  ====================================================== -->

  <div
    id="globalModal"
    class="modal hidden"
    aria-hidden="true"
  >

    <div
      class="modal-backdrop"
      onclick="ELIS.closeModal()"
    ></div>

    <div class="modal-box">

      <button
        type="button"
        class="modal-close"
        onclick="ELIS.closeModal()"
        aria-label="بستن"
      >
        ×
      </button>

      <div id="modalContent"></div>

    </div>

  </div>


  <!-- =====================================================
       TOAST
  ====================================================== -->

  <div
    id="toast"
    class="toast"
    aria-live="polite"
  ></div>


  <!-- =====================================================
       SCRIPTS
  ====================================================== -->

  <script src="data.js"></script>
  <script src="app.js"></script>


  <!-- =====================================================
       INTRO CONTROLLER
  ====================================================== -->

  <script>

    /*
      این بخش فقط شروع سینمایی سایت را کنترل می‌کند.
      منطق اصلی داخل app.js قرار دارد.
    */

    window.addEventListener("load", () => {

      const intro = document.getElementById("introScreen");
      const app = document.getElementById("app");

      setTimeout(() => {

        intro.classList.add("intro-finished");

        setTimeout(() => {

          intro.style.display = "none";
          app.classList.remove("hidden");

          if (window.ELIS && typeof ELIS.start === "function") {
            ELIS.start();
          }

        }, 650);

      }, 4000);

    });

  </script>

</body>
  </html>
